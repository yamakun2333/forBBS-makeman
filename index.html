<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>虚拟 AI 电子徽章</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #111827; /* gray-900 */
        color: white;
      }
      .font-display {
        font-family: 'Orbitron', sans-serif;
      }
      /* Custom scrollbar for circular container */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Custom Animations */
      @keyframes breathe-fast {
        0%, 100% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      .animate-breathe-fast {
        animation: breathe-fast 0.6s ease-in-out infinite;
      }

      @keyframes breathe-slow {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 1; }
      }
      .animate-breathe-slow {
        animation: breathe-slow 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-once {
        animation: spin-slow 2s linear forwards;
      }
      .animate-spin-slow {
        animation: spin-slow 10s linear infinite;
      }
      
      @keyframes spin-reverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      @keyframes marquee {
        0% { transform: translate(260px, -50%); }
        100% { transform: translate(-100%, -50%); }
      }

      /* AI Entry Animation */
      @property --fill-angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
      }
      
      @keyframes fill-ring-cw {
        from { --fill-angle: 0deg; }
        to { --fill-angle: 360deg; }
      }
      
      .animate-fill-ring {
        background: conic-gradient(white var(--fill-angle), #000000 var(--fill-angle));
        animation: fill-ring-cw 2s linear forwards;
      }

      /* AI Exit Animation - Counter Clockwise Erase */
      @keyframes erase-ring-ccw {
        from { --fill-angle: 360deg; }
        to { --fill-angle: 0deg; }
      }
      
      .animate-erase-ring {
        background: conic-gradient(white var(--fill-angle), #000000 var(--fill-angle));
        animation: erase-ring-ccw 2s linear forwards;
      }

      /* Strobe Animation for Cheer Mode */
      @keyframes strobe {
        0% { opacity: 1; }
        50% { opacity: 0; }
        100% { opacity: 1; }
      }
      .animate-strobe {
        animation: strobe 0.1s steps(1, end) infinite;
      }

      /* Missing UI Transitions */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fadeIn {
        animation: fadeIn 0.5s ease-out forwards;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translate(-50%, 20px); }
        to { opacity: 1; transform: translate(-50%, 0); }
      }
      .animate-slideUp {
        animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes slideDown {
        from { opacity: 0; transform: translate(-50%, -20px); }
        to { opacity: 1; transform: translate(-50%, 0); }
      }
      .animate-slideDown {
        animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes slideUpFromBottom {
        from { opacity: 0; transform: translateY(100%); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slideUpFromBottom {
        animation: slideUpFromBottom 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",

    "react": "https://aistudiocdn.com/react@^19.2.1"
  }
}
</script>

</head>
